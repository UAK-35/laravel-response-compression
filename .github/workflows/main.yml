# @guards-index guard CI on `tags: ["v*"]`
#
# a published version — release or prerelease — with no CI record against it

# @guards-index guard CI running the gate
#
# a gate that is weaker than the one a tag is cut behind

# @guards-index guard `composer checks -- --require-all` in CI
#
# a check that *skipped* on the runner — a tool that did not install is a hole in the build, not a fact about the machine

name: PHP Composer

on:
  push:
    # `development` is the lane these releases are cut from — the branch `.release-lane` names —
    # so it is gated the way `main` is rather than being the one branch no run ever sees. A push
    # to any other branch still triggers nothing. The ref list below has to stay literal: GitHub
    # evaluates `on.push.branches` before any step runs, so this cannot read the file. The step in
    # the build job reads it instead and requires this list to gate it.
    branches: [ "main", "development" ]
    # A tag is what Packagist publishes, and `branches` alone excludes tag refs: without this
    # every published version — release or prerelease — would carry no CI record at all. The
    # workflow also reads this file with `yaml-lint`, so a broken trigger fails the gate.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # The dev tools are pinned to exact versions so that this gate is the one a workstation runs.
  # A run that never resolves anything new cannot answer "what would the newest tools do?", so
  # once a month — and on demand — the same job loosens those pins before it starts. That is the
  # run that would have caught `rector/rector` 2.6.7 removing a prepared set this repository
  # passed, rather than the push that published a version behind a red one.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The version this build installs is not written here. It is composer.json's
  # `require.php`, read by `.agents/php-bin.sh` — the one file in this checkout
  # that decides which PHP anything runs — so the requirement and the matrix
  # cannot be two answers to one question, and the check that keeps them honest
  # on a workstation keeps them honest here. One entry, not three: a release
  # below `require.php` could not get past `composer install`, and the resolver
  # reads exactly the version `composer validate` enforces.
  pin:
    name: The PHP composer.json requires
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.php.outputs.matrix }}
    steps:
    - uses: actions/checkout@v4
    - name: Read the required version
      id: php
      # A JSON array rather than a version, because that is the shape
      # `strategy.matrix` takes and this is the half of the pair that decides.
      run: echo "matrix=$(sh .agents/php-bin.sh --matrix)" >> "$GITHUB_OUTPUT"

  build:

    needs: pin

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.pin.outputs.matrix) }}

    name: PHP ${{ matrix.php }}

    steps:
    - uses: actions/checkout@v4
      with:
        # Full history: `bin/release.php` counts a prerelease lane from the tags, and Composer
        # guesses the root package version from them too, which a shallow clone gets wrong.
        fetch-depth: 0

    - name: The lane a release is cut from is gated
      # The lane is written down once, in `.release-lane`, and `bin/release.php` reads it there as the
      # branch it releases from. This workflow cannot: `on.push.branches` is evaluated before any step
      # runs, so the ref list above has to be literal. This is where the two are reconciled — the file
      # is read, and the literal list has to gate what it names, so moving the lane to a branch no run
      # ever sees fails here instead of leaving every release from it with no CI record at all.
      run: |
        lane="$(cat .release-lane)"
        if ! grep -q "\"$lane\"" .github/workflows/main.yml; then
          echo "The lane is $lane, and this workflow's push trigger does not gate it."
          exit 1
        fi
        echo "The lane is $lane, and this workflow gates it."

    - name: Pin the root package version
      # Branch builds only. `dev-` plus the ref name is how a branch is spelled as a version,
      # and a slash is not valid in one. On a tag build the ref name is the tag, so the same
      # line would pin `dev-v0.1.0-alpha1` — a string Composer accepts and which means nothing.
      # Left unset there, the guess answers with the tag, which a prerelease tag can do because
      # a prerelease tag is a version Composer can read.
      if: github.ref_type != 'tag'
      run: |
        BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
        echo "COMPOSER_ROOT_VERSION=dev-${BRANCH//\//-}" >> "$GITHUB_ENV"

    - name: Install the system libraries the extensions build against
      # composer.json requires ext-brotli and ext-zstd. Both are PECL extensions and
      # the runner ships neither their headers nor, for zstd, the library itself.
      run: sudo apt-get update && sudo apt-get install -y libbrotli-dev libzstd-dev

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: brotli, zstd
        # composer test:unit runs bin/coverage.php, and a coverage floor needs a
        # driver: PHPUnit reads PCOV or Xdebug, and PCOV is the cheaper of the two.
        # The two scripts in bin/ are measured the same way, from the child
        # processes the suite spawns, so the driver has to be there for the runner
        # and for every one of those children. Without it the floor reports that
        # nothing was collected rather than a number.
        coverage: pcov

    - name: Probe the toolchain
      # The machine's own question, asked before anything depends on the answer. The gate
      # asks it too — `platform` asks what *Composer* requires of this interpreter, and
      # `toolchain` asks everything else — but the gate runs after `composer install`, and
      # `composer install` is itself a step that cannot work under the wrong PHP. Asked here
      # first, a runner with the wrong PHP, a missing extension or no coverage driver fails
      # in one line naming the process that is wrong, instead of resolving dependencies it
      # cannot run and going red somewhere inside the suite.
      #
      # `python3` rather than `python`: this is the one interpreter this package does not
      # decide once — nothing here runs under it but this probe — and the name a runner is
      # guaranteed to have is `python3`.
      #
      # `vendor/` is not there yet, so the tools the probe would run are noted rather than
      # reported; the gate asks that half once the dependencies are in place, where
      # `--require-all` makes a tool that failed to install a failure.
      run: python3 .agents/verify.py --only=tools

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        # This is a library and composer.lock is gitignored, so a fresh checkout has
        # no lock to hash — composer.json is the only manifest there is. Keying on a
        # lock no clone contains would put every build on the same empty hash.
        key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Loosen the dev pins
      # Scheduled and manually dispatched runs only. The gate is pinned to the tools known to
      # pass; this step is what asks the other question. `--no-update` keeps the pins step to
      # writing composer.json, and the single `update` then resolves the newest of everything.
      # Whatever it finds is reported by the run rather than by a release.
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        composer require --dev --no-update \
          "laravel/pint:*" \
          "orchestra/testbench:*" \
          "pestphp/pest:*" \
          "pestphp/pest-plugin-laravel:*" \
          "pestphp/pest-plugin-type-coverage:*" \
          "phpstan/phpstan:*" \
          "rector/rector:*" \
          "symfony/var-dumper:*"
        composer update --no-progress

    - name: Run the check suite
      # Eleven checks in one process, and the same gate a tag is cut behind locally:
      # PHP syntax, an AST parse of the same files, `composer validate --strict`,
      # platform requirements (which is where a missing ext-brotli or ext-zstd is
      # reported as a build problem rather than as a test failure), the toolchain
      # probe — the machine's own question, asked of `.agents/verify.py` — the agentic
      # layer (the same program, `--layer` and `--selftest`: this repository's account
      # of itself, and the proof that each of its readings still names a planted fault,
      # so a step that has stopped checking fails here instead of passing quietly), the
      # workflow
      # YAML — this file included — PHPStan, Pint, Rector and Pest. CI must not be
      # weaker than the gate, so the whole thing runs here rather than the four-step
      # `composer test` subset. A tool the runner is missing drops to a skip;
      # `--require-all` is what would turn that into a failure.
      # `--require-all` is the whole point of running the gate here: on a developer's
      # machine a missing tool is a skip, and on a runner a tool that failed to install
      # would otherwise read as a green build.
      run: composer checks -- --require-all

    - name: Enforce the coverage floor
      # Pest runs twice on purpose. bin/checks.php runs it without coverage, because
      # the same gate is run on machines that have no coverage driver installed, and
      # asking there would fail every check for a reason about the machine. The one
      # thing it therefore cannot assert — the floor `composer test:unit` enforces —
      # is what this step is for, and the runner has PCOV.
      #
      # That floor is `bin/coverage.php` rather than Pest, because the two scripts in
      # bin/ can only be reached as child processes: the runner puts a collector in
      # front of every script the suite spawns, merges what those processes covered
      # back onto the files they were copied from, and holds every src/ file at 100.0%
      # with a ratchet per script. A missing driver is reported as a failure to measure
      # rather than as a floor of nothing, and the run opens by naming the PHP it is under
      # and the driver it found — with the floors repeated at the foot of a failure — so a
      # red step says which machine produced the number rather than leaving it to guesswork.
      run: composer test:unit

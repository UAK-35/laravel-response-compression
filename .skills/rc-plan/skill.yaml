# =============================================================================
# rc-plan — a plan on a prompt, kept under docs/plans/
# =============================================================================
# `description` is read by the `descriptions` step of `python .agents/verify.py`:
# every hyphenated word in it is read as a command name, so the two that appear
# here (`rc-plan` and `record`) are commands `instructions.md` defines. The two
# markers are written with their leading slash on purpose - `/rc-plan` is not a
# command name and is not read as one, where the bare word would be. Nothing else
# hyphenated belongs in this description.
#
# The generator reads a small subset of YAML: `tags` and `categories` are one
# comma separated line rather than a list, and there is no `files:` key.
name: "rc-plan"
version: "1.0.0"
description: "Write a plan about a prompt and keep it under docs/plans/, named by a sequence number, the date it was made and a slug. Activate when a prompt begins with the /rc-plan marker or the /lpr-plan marker, or when a prompt asks to create a plan, to plan the work of something, or says a plan is needed and the user answers yes to 'Is this an RC plan?'. Commands - rc-plan, record."
instructions: "instructions.md"
author: "UAK35"
license: "MIT"
tags: plan, docs, steps, workflow, package
categories: tooling

sync:
  freebuff:
    enabled: true
    name_override: "rc-plan"
  gemini:
    enabled: true
  windsurf:
    enabled: true
    filename: "rc-plan.windsurf.md"

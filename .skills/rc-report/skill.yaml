# =============================================================================
# rc-report — a report on a prompt, kept under docs/reports/
# =============================================================================
# `description` is read by the `descriptions` step of `python .agents/verify.py`:
# every hyphenated word in it is read as a command name, so the two that appear
# here (`rc-report` and `record`) are commands `instructions.md` defines. The two
# markers are written with their leading slash on purpose - `/rc-report` is not a
# command name and is not read as one, where the bare word would be. Nothing else
# hyphenated belongs in this description.
#
# The generator reads a small subset of YAML: `tags` and `categories` are one
# comma separated line rather than a list, and there is no `files:` key.
name: "rc-report"
version: "1.0.0"
description: "Write a report about a prompt and keep it under docs/reports/, named by a sequence number, the date it was made and a slug. Activate when a prompt begins with the /rc-report marker or the /lpr-report marker, or when a prompt asks to create a report, to report the state of something, or says a report is needed and the user answers yes to 'Is this an RC report?'. Commands - rc-report, record."
instructions: "instructions.md"
author: "UAK35"
license: "MIT"
tags: report, docs, audit, findings, package
categories: tooling

sync:
  freebuff:
    enabled: true
    name_override: "rc-report"
  gemini:
    enabled: true
  windsurf:
    enabled: true
    filename: "rc-report.windsurf.md"
